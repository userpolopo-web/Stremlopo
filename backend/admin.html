<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stremlopo • Administração</title><style>body{background:#090909;color:#eee;font:16px system-ui;max-width:1000px;margin:40px auto;padding:20px}input,textarea,button{background:#242424;color:white;border:1px solid #555;border-radius:8px;padding:12px;box-sizing:border-box}input,textarea{width:100%;margin:8px 0}textarea{min-height:380px;font:14px monospace}button{cursor:pointer;margin:6px}article{padding:18px;background:#191919;border-radius:12px;margin:16px 0}.muted{color:#aaa}pre{white-space:pre-wrap}#status{color:#ddd}</style><h1>STREMLOPO</h1><p class="muted">Catálogo • Fontes autorizadas • Licenças</p><label>Chave administrativa<input id="token" type="password" autocomplete="off" placeholder="ADMIN_TOKEN do servidor"></label><button id="load">Carregar catálogo</button><button id="reports">Ver denúncias</button><h2>Cadastro de conteúdo</h2><p>Salvar cria um rascunho e revoga qualquer publicação anterior. A revisão de direitos é manual: o sistema não comprova a validade jurídica de uma licença.</p><textarea id="editor" spellcheck="false"></textarea><button id="save">Salvar rascunho</button><button id="new">Novo cadastro</button><p id="status" role="status"></p><div id="list"></div><script>
const $=id=>document.getElementById(id);
const blank=()=>({title:'',synopsis:'',genre:'',year:2026,duration:0,poster:'',kind:'movie',monetized:false,sources:[{url:'https://',format:'mp4'}],rights:{holder:'',license:'',evidence:'',attribution:'',verified_by:'',verified:false,embedded_allowed:false,commercial_allowed:false}});
$('editor').value=JSON.stringify(blank(),null,2);
async function api(path,method='GET',body){const r=await fetch('/api/admin/'+path,{method,headers:{Authorization:'Bearer '+$('token').value,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function run(fn){try{$('status').textContent='Processando…';await fn();$('status').textContent='Concluído.'}catch(e){$('status').textContent=e.message}}
async function load(){const items=await api('content');$('list').replaceChildren();for(const item of items){const card=document.createElement('article'),title=document.createElement('h3'),state=document.createElement('p');title.textContent=item.title;state.textContent=item.published?'Publicado':'Rascunho • revisão necessária';card.append(title,state);for(const [text,fn] of [['Editar',()=>{$('editor').value=JSON.stringify(item,null,2);scrollTo(0,0)}],['Publicar',async()=>{await api('content/'+item.id+'/publish','POST');await load()}],['Remover',async()=>{if(confirm('Remover este conteúdo?')){await api('content/'+item.id,'DELETE');await load()}}]]){const b=document.createElement('button');b.textContent=text;b.onclick=()=>run(fn);card.append(b)}$('list').append(card)}}
$('load').onclick=()=>run(load);$('save').onclick=()=>run(async()=>{await api('content','POST',JSON.parse($('editor').value));await load()});$('new').onclick=()=>{$('editor').value=JSON.stringify(blank(),null,2)};$('reports').onclick=()=>run(async()=>{const p=document.createElement('pre');p.textContent=JSON.stringify(await api('reports'),null,2);$('list').replaceChildren(p)});
</script></html>
